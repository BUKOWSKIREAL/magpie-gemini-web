name: Verify backend release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/native.mjs'
      - 'lib/backend-release.json'
      - 'patches/**'
      - 'scripts/backend*.mjs'
      - 'test/backend-release.test.mjs'
      - '.github/workflows/backend.yml'

permissions:
  contents: read

jobs:
  plugin:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm test
      - run: npm pack --dry-run

  backend:
    name: Build and run (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-15
          - macos-15-intel
          - ubuntu-24.04
          - ubuntu-24.04-arm
          - windows-2025
          - windows-11-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Rebuild from pinned sources, test, and compare SHA-256
        run: node scripts/backend-release.mjs --target=host --verify
      - name: Install and start the real backend with isolated data
        run: node scripts/backend-smoke.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: backend-${{ matrix.runner }}
          path: backend-build/release/*
          if-no-files-found: error

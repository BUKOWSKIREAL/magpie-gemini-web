name: Official AI Studio upstream watch

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:
    inputs:
      force_verify:
        description: Run full 5-OS matrix even if latest tag+digest already passed
        required: false
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  resolve:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: read
    outputs:
      tag: ${{ steps.latest.outputs.tag }}
      fingerprint: ${{ steps.latest.outputs.fingerprint }}
      cache_hit: ${{ steps.cache.outputs.cache-hit }}
      should_verify: ${{ steps.decide.outputs.should_verify }}
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - id: latest
        name: Resolve latest upstream AIStudio2API release tag and open watch status
        env:
          AI_STUDIO_GITHUB_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: |
          node --input-type=module <<'JS'
          import crypto from 'node:crypto';
          import fs from 'node:fs';
          import { setTimeout as delay } from 'node:timers/promises';

          const headers = {
            Accept: 'application/vnd.github+json',
            'User-Agent': 'magpie-gemini-web-upstream-watch'
          };
          if (process.env.AI_STUDIO_GITHUB_TOKEN) {
            headers.Authorization = `Bearer ${process.env.AI_STUDIO_GITHUB_TOKEN}`;
          }

          async function fetchJsonWithRetry(url) {
            const backoffs = [2000, 5000];
            let lastError;
            for (let attempt = 0; attempt <= backoffs.length; attempt += 1) {
              try {
                const res = await fetch(url, {
                  headers,
                  signal: AbortSignal.timeout(30000)
                });
                if (res.ok) return res.json();
                const status = res.status;
                const retryable = status === 429 || status >= 500;
                const text = await res.text().catch(() => '');
                if (!retryable || attempt === backoffs.length) {
                  throw new Error(`GET ${url} failed: HTTP ${status} ${text.slice(0, 200)}`);
                }
                lastError = new Error(`HTTP ${status}`);
              } catch (error) {
                if (attempt === backoffs.length) throw error;
                lastError = error;
              }
              await delay(backoffs[attempt]);
            }
            throw lastError;
          }

          const payload = await fetchJsonWithRetry('https://api.github.com/repos/Mag1cFall/AIStudio2API/releases/latest');
          const tag = String(payload?.tag_name || '').trim();
          if (!/^v?\d+\.\d+\.\d+(?:-[0-9A-Za-z.-]+)?(?:\+[0-9A-Za-z.-]+)?$/.test(tag)) {
            throw new Error(`Invalid upstream tag_name received: ${JSON.stringify(tag)}`);
          }

          const assets = Array.isArray(payload?.assets) ? payload.assets : [];
          const assetSummary = assets
            .map(a => `${String(a?.name || '')}:${String(a?.digest || a?.id || '')}`)
            .sort()
            .join('\n');
          const digestHash = crypto.createHash('sha256').update(assetSummary).digest('hex').slice(0, 12);
          const fingerprint = `${tag}-${digestHash}`;

          const prefix = '[Upstream Watch] Official AIStudio2API ';
          let hasOpenIssue = false;
          for (let page = 1; page <= 20; page += 1) {
            const items = await fetchJsonWithRetry(
              `https://api.github.com/repos/${process.env.REPO}/issues?state=open&per_page=100&page=${page}`
            );
            if (!Array.isArray(items) || items.length === 0) break;
            if (items.some(item => !item.pull_request && typeof item.title === 'string' && item.title.startsWith(prefix))) {
              hasOpenIssue = true;
              break;
            }
            if (items.length < 100) break;
          }

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `tag=${tag}\nfingerprint=${fingerprint}\nhas_open_issue=${String(hasOpenIssue)}\n`
          );
          console.log(`Resolved upstream release ${tag} (fingerprint=${fingerprint}, openIssue=${hasOpenIssue})`);
          JS
      - id: cache
        name: Check cached verification status for this upstream fingerprint
        uses: actions/cache/restore@v4
        with:
          path: .upstream-watch-stamp
          key: upstream-watch-pass-v1-${{ steps.latest.outputs.fingerprint }}
          lookup-only: true
      - id: decide
        name: Decide whether to run full 5-OS matrix
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_VERIFY: ${{ inputs.force_verify }}
          CACHE_HIT: ${{ steps.cache.outputs.cache-hit }}
          HAS_OPEN_ISSUE: ${{ steps.latest.outputs.has_open_issue }}
          UPSTREAM_TAG: ${{ steps.latest.outputs.tag }}
          FINGERPRINT: ${{ steps.latest.outputs.fingerprint }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          const eventName = process.env.EVENT_NAME || '';
          const forceVerify = process.env.FORCE_VERIFY || '';
          const cacheHit = process.env.CACHE_HIT === 'true';
          const hasOpenIssue = process.env.HAS_OPEN_ISSUE === 'true';
          const isMondayUtc = new Date().getUTCDay() === 1;

          const reasons = [];
          if (eventName === 'workflow_dispatch' && forceVerify !== 'false') reasons.push('manual-force');
          if (!cacheHit) reasons.push('new-or-uncached-fingerprint');
          if (hasOpenIssue) reasons.push('open-watch-issue');
          if (isMondayUtc) reasons.push('weekly-monday-patrol');

          const shouldVerify = reasons.length > 0;
          fs.appendFileSync(process.env.GITHUB_OUTPUT, `should_verify=${String(shouldVerify)}\n`);
          if (shouldVerify) {
            console.log(`Running 5-OS verification for ${process.env.UPSTREAM_TAG} (${process.env.FINGERPRINT}): ${reasons.join(', ')}`);
          } else {
            console.log(`Skipping 5-OS verification: ${process.env.UPSTREAM_TAG} (${process.env.FINGERPRINT}) already passed.`);
          }
          JS

  verify:
    needs: resolve
    if: needs.resolve.outputs.should_verify == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/studio-official.yml
    with:
      ref: ${{ github.sha }}

  report:
    needs: [resolve, verify]
    if: always() && !cancelled() && needs.resolve.outputs.should_verify == 'true' && (needs.verify.result == 'success' || needs.verify.result == 'failure')
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - name: Write verification stamp
        if: needs.verify.result == 'success' && needs.resolve.outputs.cache_hit != 'true'
        env:
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          FINGERPRINT: ${{ needs.resolve.outputs.fingerprint }}
        run: |
          node --input-type=module <<'JS'
          import fs from 'node:fs';

          fs.writeFileSync('.upstream-watch-stamp', JSON.stringify({
            tag: process.env.UPSTREAM_TAG || '',
            fingerprint: process.env.FINGERPRINT || '',
            verifiedAt: new Date().toISOString()
          }, null, 2) + '\n');
          JS
      - name: Cache verified upstream fingerprint
        if: needs.verify.result == 'success' && needs.resolve.outputs.cache_hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: .upstream-watch-stamp
          key: upstream-watch-pass-v1-${{ needs.resolve.outputs.fingerprint }}
      - name: Sync upstream compatibility tracking issue
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          UPSTREAM_TAG: ${{ needs.resolve.outputs.tag }}
          VERIFY_RESULT: ${{ needs.verify.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          node --input-type=module <<'JS'
          const token = process.env.GH_TOKEN;
          const repo = process.env.REPO;
          const tag = (process.env.UPSTREAM_TAG || '').trim() || 'latest';
          const verifyResult = process.env.VERIFY_RESULT;
          const runUrl = process.env.RUN_URL;

          if (!token || !repo) throw new Error('Missing GitHub token or repository context');

          const prefix = '[Upstream Watch] Official AIStudio2API ';
          const targetTitle = `${prefix}${tag} compatibility check failed`;
          const headers = {
            Accept: 'application/vnd.github+json',
            Authorization: `Bearer ${token}`,
            'User-Agent': 'magpie-gemini-web-upstream-watch',
            'X-GitHub-Api-Version': '2022-11-28'
          };

          async function api(url, init = {}) {
            const res = await fetch(url, {
              ...init,
              headers: { ...headers, ...(init.headers || {}) },
              signal: AbortSignal.timeout(30000)
            });
            if (!res.ok) {
              const text = await res.text().catch(() => '');
              throw new Error(`GitHub API ${init.method || 'GET'} ${url} failed: HTTP ${res.status} ${text.slice(0, 300)}`);
            }
            return res.json();
          }

          async function apiAll(baseUrl) {
            const sep = baseUrl.includes('?') ? '&' : '?';
            const all = [];
            for (let page = 1; page <= 20; page += 1) {
              const items = await api(`${baseUrl}${sep}per_page=100&page=${page}`);
              if (!Array.isArray(items) || items.length === 0) break;
              all.push(...items);
              if (items.length < 100) break;
            }
            return all;
          }

          const openIssues = (await apiAll(`https://api.github.com/repos/${repo}/issues?state=open`))
            .filter(item => !item.pull_request && typeof item.title === 'string' && item.title.startsWith(prefix));

          if (verifyResult === 'success') {
            for (const issue of openIssues) {
              await api(`https://api.github.com/repos/${repo}/issues/${issue.number}/comments`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  body: `Official AIStudio2API upstream watch recovered on \`${tag}\`: ${runUrl}`
                })
              });
              await api(`https://api.github.com/repos/${repo}/issues/${issue.number}`, {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ state: 'closed' })
              });
            }
            console.log(`Upstream watch passed for ${tag}; closed ${openIssues.length} open tracking issue(s).`);
          } else if (verifyResult === 'failure') {
            const existing = openIssues.find(issue => issue.title === targetTitle);
            if (existing) {
              const comments = await apiAll(`https://api.github.com/repos/${repo}/issues/${existing.number}/comments`);
              const alreadyLogged = String(existing.body || '').includes(runUrl) ||
                comments.some(c => String(c.body || '').includes(runUrl));
              if (!alreadyLogged) {
                await api(`https://api.github.com/repos/${repo}/issues/${existing.number}/comments`, {
                  method: 'POST',
                  headers: { 'Content-Type': 'application/json' },
                  body: JSON.stringify({
                    body: `Still failing on \`${tag}\`: ${runUrl}`
                  })
                });
              }
              console.log(`Updated existing upstream watch issue #${existing.number}`);
            } else {
              const created = await api(`https://api.github.com/repos/${repo}/issues`, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                  title: targetTitle,
                  body: [
                    `Daily upstream watch detected an official \`Mag1cFall/AIStudio2API\` compatibility failure for \`${tag}\`.`,
                    '',
                    `- Workflow run: ${runUrl}`,
                    '',
                    'Reproduce locally with `node scripts/studio-official-smoke.mjs` and `node scripts/studio-auto-update-smoke.mjs`.'
                  ].join('\n')
                })
              });
              console.log(`Opened upstream watch issue #${created.number}`);
            }
          }
          JS

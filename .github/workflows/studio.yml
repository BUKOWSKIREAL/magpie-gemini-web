name: Verify managed AI Studio release

on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'lib/studio*.mjs'
      - 'lib/studio-release.json'
      - 'patches/studio-managed.patch'
      - 'scripts/studio*'
      - 'test/studio*.mjs'
      - '.github/workflows/studio.yml'

permissions:
  contents: read

jobs:
  studio:
    name: Build and run (${{ matrix.runner }})
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-15-intel, ubuntu-24.04, ubuntu-24.04-arm, windows-2025]
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    steps:
      - run: git config --global core.autocrlf false
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '26.8.2'
      - uses: actions/setup-go@v5
        with:
          go-version: '1.27.1'
          cache: false
      - name: Build pinned source, test, and compare archive and executable hashes
        run: node scripts/studio-release.mjs --target=host --verify
      - name: Test real install, update refusal, admin page, and stop without Google accounts
        run: node scripts/studio-managed-smoke.mjs
      - name: Plugin tests with the verified local archive
        run: |
          export AI_STUDIO_TEST_ARCHIVE="$(node --input-type=module -e 'import r from "./lib/studio-release.json" with {type:"json"}; console.log(process.cwd()+"/studio-build/release/"+r.binaries[process.platform+"-"+process.arch].asset)')"
          # The macOS-only Task route and older Web fixtures assume POSIX.
          # Exercise the complete Studio suite on Windows, plus the real binary above.
          if [[ "$RUNNER_OS" == "Windows" ]]; then
            node --test test/studio-native.test.mjs test/studio.test.mjs
          else
            npm test
          fi
          npm pack --dry-run
      - uses: actions/upload-artifact@v4
        with:
          name: studio-${{ matrix.runner }}
          path: studio-build/release/*
          if-no-files-found: error
